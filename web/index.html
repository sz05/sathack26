<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Doubt Solver</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Lecture Doubt Solver</h1>
  <span class="badge">Public demo · sample lecture</span>
</header>
<main>
  <section class="lecture" aria-labelledby="lecture-title">
    <h2 id="lecture-title">Loading the lecture…</h2>
    <p class="note" id="lecture-note"></p>
    <ol class="transcript" id="transcript"></ol>
  </section>
  <section class="ask" aria-labelledby="ask-title">
    <h2 id="ask-title">Ask a doubt</h2>
    <p class="note">Type the step that didn't make sense. The answer links to the moment in the lecture.</p>
    <div class="answers" id="answers" aria-live="polite"></div>
    <form id="ask-form">
      <textarea id="question" rows="2" maxlength="600" placeholder="e.g. binary search yahan kyun lag sakti hai?" required></textarea>
      <button type="submit" id="ask-button">Ask</button>
    </form>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
